<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Living the dream</title>
    <meta name="description" content="Personal offline-first travel companion" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <!-- Two themes, dark by default. The app decides which, never the phone:
         there is no prefers-color-scheme anywhere in this build. -->
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b0c16" />
    <script>
      /* BEFORE THE FIRST PAINT. Dexie cannot answer this early, so the theme
         is mirrored into localStorage by src/lib/logic/theme.ts and read back
         here — otherwise a daylight user watches night indigo flash to
         paper on every launch. Dark needs no attribute, so the default costs nothing.
         The key and the colour are asserted against theme.ts by its test. */
      try {
        if (localStorage.getItem('ltd:theme') === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f5f1ea');
        }
      } catch (e) {
        /* private mode: one flash, never a broken boot */
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <div id="sw-update" class="sw-update">
      <button id="sw-reload" class="swu-main" type="button">Update ready — tap to reload</button>
      <button id="sw-dismiss" class="swu-x" type="button" aria-label="Dismiss">✕</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
