<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The 16 px version of the launcher icon: sun, two ridges, a lit horizon.
       Everything smaller than a ridge is dropped — a tab favicon has no room
       for a glow gradient. -->
  <rect width="64" height="64" rx="14" fill="#000000"/>
  <circle cx="32" cy="28" r="11" fill="#e8b04b"/>
  <path d="M 30 46 L 43 28 L 58 46 Z" fill="#1a140c"/>
  <path d="M 30 46 L 43 28 L 58 46" fill="none" stroke="#8a6a35"
        stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M 6 46 L 21 25 L 33 46 Z" fill="#0a0908"/>
  <path d="M 6 46 L 21 25 L 33 46" fill="none" stroke="#e8b04b"
        stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="6" y="44.5" width="52" height="3.6" rx="1.8" fill="#c9924a"/>
</svg>
