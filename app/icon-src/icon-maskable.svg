<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Adaptive-icon foreground: the launcher may crop to a circle, a squircle or
       a rounded square, so everything lives inside the centre safe zone. Lantern
       palette, same sun-behind-mountains motif as icon.svg. -->
  <defs>
    <radialGradient id="glowm" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8b04b" stop-opacity="0.5"/>
      <stop offset="48%" stop-color="#e8b04b" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#e8b04b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sunm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0c069"/>
      <stop offset="100%" stop-color="#c9924a"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="#000000"/>
  <g transform="translate(256 268) scale(0.62) translate(-256 -268)">
    <circle cx="256" cy="228" r="210" fill="url(#glowm)"/>
    <circle cx="256" cy="228" r="80" fill="url(#sunm)"/>

    <path d="M 236 372 L 344 226 L 468 372 Z" fill="#1a140c"/>
    <path d="M 236 372 L 344 226 L 468 372" fill="none" stroke="#8a6a35"
          stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>

    <path d="M 44 372 L 168 202 L 268 372 Z" fill="#0a0908"/>
    <path d="M 44 372 L 168 202 L 268 372" fill="none" stroke="#e8b04b"
          stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>

    <rect x="44" y="360" width="424" height="22" rx="11" fill="#c9924a"/>
  </g>
</svg>
