<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Living the dream — the sun rising behind mountains, redrawn in Lantern
       (2026-07-26): warm gold light against true black instead of ink on cream.
       Still four bold shapes plus a glow, so it reads at 48 px in the drawer;
       the ridges carry a gold rim-light because on black a silhouette needs an
       edge to exist at all. -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8b04b" stop-opacity="0.55"/>
      <stop offset="48%" stop-color="#e8b04b" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#e8b04b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0c069"/>
      <stop offset="100%" stop-color="#c9924a"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="100" fill="#000000"/>
  <circle cx="256" cy="228" r="196" fill="url(#glow)"/>
  <circle cx="256" cy="228" r="80" fill="url(#sun)"/>

  <path d="M 236 372 L 344 226 L 468 372 Z" fill="#1a140c"/>
  <path d="M 236 372 L 344 226 L 468 372" fill="none" stroke="#8a6a35"
        stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>

  <path d="M 44 372 L 168 202 L 268 372 Z" fill="#0a0908"/>
  <path d="M 44 372 L 168 202 L 268 372" fill="none" stroke="#e8b04b"
        stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>

  <rect x="44" y="360" width="424" height="22" rx="11" fill="#c9924a"/>
</svg>
