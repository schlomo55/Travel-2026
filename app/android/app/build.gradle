apply plugin: 'com.android.application'

/* Release signing. The key must never change: Android refuses to install an
   update signed by a different key, and the only way through is uninstalling —
   which would delete every trip on the phone. See android/SIGNING.md.
   The key lives OUTSIDE the repository (owner's decision, 2026-09-29: the repo
   was public until 2026-09-28). First found wins: $LTD_KEYSTORE_PROPERTIES,
   ~/.ltd-private/android/keystore.properties, then — for checkouts made before
   the move — keystore.properties next to this project. `storeFile` is read
   relative to the properties file's own folder. */
def keystorePropsFile = [
    System.getenv("LTD_KEYSTORE_PROPERTIES"),
    "${System.getProperty('user.home')}/.ltd-private/android/keystore.properties",
    rootProject.file("keystore.properties").path,
].findResult { p -> (p && new File(p).exists()) ? new File(p) : null }
def keystoreProps = new Properties()
if (keystorePropsFile) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace "com.livingthedream.travel"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.livingthedream.travel.horizon"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "2.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropsFile) {
                storeFile new File(keystorePropsFile.parentFile, keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keystorePropsFile) {
                signingConfig signingConfigs.release
            }
        }
    }
}

/* LONG-PRESS SHORTCUTS (the Reminders run). A static shortcut must name the
   package it opens, and this project builds two: com.livingthedream.travel
   (the real LTD) and the .horizon preview that sits beside it on the phone.
   A hand-written file would open the wrong one of the two, so it is written
   here from the applicationId being built. Each opens MainActivity with an
   ltd://open/<place> URL; lib/platform/shortcuts.ts routes it to that place
   in the trip on the road (or the shelf). */
def ltdShortcutsRes = layout.buildDirectory.dir("generated/ltd-shortcuts/res").get().asFile
android.sourceSets.main.res.srcDir(ltdShortcutsRes)
tasks.register('ltdShortcuts') {
    def appId = android.defaultConfig.applicationId
    def out = new File(ltdShortcutsRes, "xml/ltd_shortcuts.xml")
    inputs.property('appId', appId)
    outputs.file(out)
    doLast {
        def entry = { String id, String label ->
            """    <shortcut android:shortcutId="${id}" android:enabled="true" android:shortcutShortLabel="@string/${label}">
        <intent android:action="android.intent.action.VIEW" android:targetPackage="${appId}" android:targetClass="com.livingthedream.travel.MainActivity" android:data="ltd://open/${id}" />
    </shortcut>"""
        }
        out.parentFile.mkdirs()
        out.text = """<?xml version="1.0" encoding="utf-8"?>
<!-- GENERATED by app/build.gradle (ltdShortcuts) for ${appId}. Do not edit. -->
<shortcuts xmlns:android="http://schemas.android.com/apk/res/android">
${entry('now', 'ltd_sc_now')}
${entry('wallet', 'ltd_sc_wallet')}
${entry('map', 'ltd_sc_map')}
${entry('todo', 'ltd_sc_todo')}
</shortcuts>
"""
    }
}
preBuild.dependsOn 'ltdShortcuts'

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
