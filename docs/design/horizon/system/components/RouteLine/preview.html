<!-- @dsCard group="Map" height=300 subtitle="Flow = live · Comet = through time · Ink = done · Relay = check" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&amp;family=Figtree:wght@400..700&amp;family=Martian+Mono:wdth,wght@75..112.5,400..600&amp;display=swap">
<style>
  .hz-demo { box-sizing: border-box; min-height: 300px; padding: 20px 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; background: var(--sky); font-family: var(--font-ui); color: var(--ink); }
  .hz-cell { display: flex; flex-direction: column; gap: 6px; padding: 14px; border-radius: var(--radius-tile); background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow-card); }
  .hz-name { font: 500 18px/1.2 var(--font-display); letter-spacing: -0.01em; }
  .hz-job { font: 600 11px/1.2 var(--font-ui); letter-spacing: 0.14em; text-transform: uppercase; color: var(--sunrise); }
  .hz-when { font: 400 13px/1.45 var(--font-ui); color: var(--ink-2); }
  .hz-svg { display: block; width: 100%; height: auto; }
  .hz-grid { fill: var(--map-grid); }
  .hz-star { fill: var(--star); }
  .hz-lit { stroke: var(--route-lit); }
  .hz-fut { stroke: var(--route-future); }
  .hz-warn { stroke: var(--warn); }
  .hz-okdot { fill: var(--ok); }
  .hz-warndot { fill: var(--warn); }
  /* End states are the default (Calm motion / reduce-motion). Motion is added only when the viewer allows it. */
  @media (prefers-reduced-motion: no-preference) {
    .hz-flow { stroke-dasharray: 7 7; animation: hzFlow var(--duration-flow) linear infinite; }
    @keyframes hzFlow { to { stroke-dashoffset: -56; } }
    .hz-comet { stroke-dasharray: 10 110; animation: hzComet 3.2s var(--ease-out) infinite; }
    @keyframes hzComet { 0% { stroke-dashoffset: 110; opacity: 1; } 40% { stroke-dashoffset: 0; opacity: 1; } 55%, 100% { stroke-dashoffset: 0; opacity: 0; } }
    .hz-flash { animation: hzFlash 3.2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes hzFlash { 0%, 36% { opacity: 0; transform: scale(0.6); } 42% { opacity: 1; transform: scale(1.6); } 60%, 100% { opacity: 0; transform: scale(1); } }
    .hz-ink { stroke-dasharray: 100; animation: hzInk 4.6s linear infinite; }
    @keyframes hzInk { 0% { stroke-dashoffset: 100; opacity: 1; } 54% { stroke-dashoffset: 0; opacity: 1; } 90% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
    .hz-relay { animation: hzRelay var(--duration-relay-demo) linear infinite; opacity: 0.25; }
    .hz-relay.hz-r2 { animation-delay: 0.6s; }
    .hz-relay.hz-r3 { animation-delay: 1.2s; }
    .hz-relay.hz-r4 { animation-delay: 2.4s; }
    @keyframes hzRelay { 0% { opacity: 0.25; } 8%, 70% { opacity: 1; } 85%, 100% { opacity: 0.25; } }
  }
</style>
<div class="hz-demo">
  <div class="hz-cell">
    <span class="hz-job">Live</span>
    <span class="hz-name">Flow</span>
    <svg class="hz-svg" viewBox="0 0 200 90" aria-label="Flow: today's leg streams" role="img">
      <defs><marker id="hzArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" style="fill: var(--route-today)"></path></marker>
      <linearGradient id="hzToday" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color: var(--route-lit)"></stop><stop offset="0.6" style="stop-color: var(--route-today)"></stop><stop offset="1" style="stop-color: var(--route-future)"></stop></linearGradient></defs>
      <path class="hz-flow" d="M20 22 Q 110 30 178 70" fill="none" stroke="url(#hzToday)" stroke-width="2.5" stroke-linecap="round" marker-end="url(#hzArrow)"></path>
      <circle class="hz-star" cx="20" cy="22" r="4"></circle><circle class="hz-star" cx="180" cy="72" r="4"></circle>
    </svg>
    <span class="hz-when">Always, on today's leg — the only route that loops.</span>
  </div>
  <div class="hz-cell">
    <span class="hz-job">Through time</span>
    <span class="hz-name">Comet</span>
    <svg class="hz-svg" viewBox="0 0 200 90" aria-label="Comet: flies a leg once" role="img">
      <path d="M20 22 Q 110 30 178 70" fill="none" class="hz-fut" stroke-width="2" stroke-dasharray="1 6" stroke-linecap="round"></path>
      <path class="hz-comet hz-lit" d="M20 22 Q 110 30 178 70" pathLength="100" fill="none" stroke-width="3.5" stroke-linecap="round"></path>
      <circle class="hz-star" cx="20" cy="22" r="4"></circle><circle class="hz-star" cx="180" cy="72" r="4"></circle>
      <circle class="hz-flash" cx="180" cy="72" r="9" fill="none" style="stroke: var(--route-lit)" stroke-width="2"></circle>
    </svg>
    <span class="hz-when">Once, when you replay the trip or tap a leg. A flash on arrival.</span>
  </div>
  <div class="hz-cell">
    <span class="hz-job">Done</span>
    <span class="hz-name">Ink</span>
    <svg class="hz-svg" viewBox="0 0 200 90" aria-label="Ink: a finished leg paints itself and stays" role="img">
      <path class="hz-ink hz-lit" d="M20 22 Q 110 30 178 70" pathLength="100" fill="none" stroke-width="6" stroke-linecap="round" style="opacity: 0.35"></path>
      <path class="hz-ink hz-lit" d="M20 22 Q 110 30 178 70" pathLength="100" fill="none" stroke-width="2.5" stroke-linecap="round"></path>
      <circle class="hz-star" cx="20" cy="22" r="4"></circle><circle class="hz-star" cx="180" cy="72" r="4"></circle>
    </svg>
    <span class="hz-when">Once, when a leg or a day is done — then it stays painted.</span>
  </div>
  <div class="hz-cell">
    <span class="hz-job">Check</span>
    <span class="hz-name">Relay</span>
    <svg class="hz-svg" viewBox="0 0 200 90" aria-label="Relay: stops light in order, amber where a leg is not booked" role="img">
      <path d="M22 60 L78 30 L128 58 L180 26" fill="none" class="hz-fut" stroke-width="2" stroke-dasharray="1 6" stroke-linecap="round"></path>
      <path class="hz-relay hz-r2 hz-lit" d="M22 60 L78 30" fill="none" stroke-width="2.5" stroke-linecap="round"></path>
      <path class="hz-relay hz-r4 hz-warn" d="M128 58 L180 26" fill="none" stroke-width="2.5" stroke-dasharray="5 5" stroke-linecap="round"></path>
      <path class="hz-relay hz-r3 hz-lit" d="M78 30 L128 58" fill="none" stroke-width="2.5" stroke-linecap="round"></path>
      <circle class="hz-relay hz-okdot" cx="22" cy="60" r="5"></circle>
      <circle class="hz-relay hz-r2 hz-okdot" cx="78" cy="30" r="5"></circle>
      <circle class="hz-relay hz-r3 hz-okdot" cx="128" cy="58" r="5"></circle>
      <circle class="hz-relay hz-r4 hz-warndot" cx="180" cy="26" r="5"></circle>
    </svg>
    <span class="hz-when">Once, when you open Journey. Ends on a count: 1 leg to book.</span>
  </div>
</div>
