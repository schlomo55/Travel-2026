<!-- @dsCard group="Navigation" height=140 subtitle="Now · Journey · Pocket + Find" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..700&amp;display=swap">
<style>
  .hz-demo { box-sizing: border-box; position: relative; min-height: 140px; padding: 36px 16px 24px; display: flex; align-items: center; gap: 12px; background: var(--sky); font-family: var(--font-ui); overflow: hidden; }
  .hz-glow { position: absolute; left: -20%; right: -20%; bottom: -120px; height: 220px; border-radius: 50%; background: radial-gradient(closest-side, var(--horizon-glow), transparent); pointer-events: none; }
  .hz-nav { position: relative; flex: 1 1 auto; max-width: 320px; display: flex; height: 64px; padding: 6px; box-sizing: border-box; border-radius: 32px; background: var(--sky-2); border: 1px solid var(--line); box-shadow: var(--shadow-float); }
  .hz-item { flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; font: 500 11px/1 var(--font-ui); color: var(--ink-2); border-radius: 26px; }
  .hz-item svg { width: 22px; height: 22px; }
  .hz-item[aria-current="page"] { color: var(--sunrise); font-weight: 600; }
  .hz-item[aria-current="page"]::after { content: ""; width: 4px; height: 4px; margin-top: 1px; border-radius: 999px; background: var(--sunrise-fill); box-shadow: 0 0 6px var(--sunrise-fill); }
  .hz-item:focus-visible, .hz-find:focus-visible { outline: 2px solid var(--sunrise); outline-offset: 2px; }
  .hz-find { position: relative; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; width: 52px; height: 52px; padding: 0; border-radius: var(--radius-pill); color: var(--ink); background: var(--card-2); border: 1px solid var(--edge); box-shadow: var(--shadow-float); cursor: pointer; }
</style>
<div class="hz-demo">
  <div class="hz-glow" aria-hidden="true"></div>
  <nav class="hz-nav" aria-label="Main">
    <a class="hz-item" href="#" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg>
      Now
    </a>
    <a class="hz-item" href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="19" r="3"></circle><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"></path><circle cx="18" cy="5" r="3"></circle></svg>
      Journey
    </a>
    <a class="hz-item" href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"></path><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"></path></svg>
      Pocket
    </a>
  </nav>
  <button class="hz-find" type="button" aria-label="Find anything">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
  </button>
</div>
